name: TestFlight Release

on:
  workflow_dispatch:
    inputs:
      sans_captcha:
        description: >-
          Publier SANS clé de site anti-robot. À ne cocher que tant que le
          réglage CAPTCHA de Supabase est éteint : une fois ce réglage
          activé, une version sans clé enferme dehors tous les téléphones.
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════════════
      # LE GARDE-FOU QUI ÉVITE D'ENFERMER TOUT LE PARC DEHORS
      # ══════════════════════════════════════════════════════════════
      #
      # `OASIS_TURNSTILE_SITE_KEY` est livrée VIDE dans project.yml, et
      # c'est un état valide : sans elle, l'application n'envoie aucun
      # jeton anti-robot et se comporte exactement comme avant.
      #
      # LE PIÈGE EST QUE CET ÉTAT EST AUSSI CELUI QU'ON OBTIENT EN NE
      # FAISANT RIEN. Une version compilée sans clé passe les tests,
      # passe la revue, s'installe sur les téléphones, et fonctionne
      # parfaitement — jusqu'à la seconde où le réglage CAPTCHA est
      # activé chez Supabase. Là, tout le parc est dehors, sans message
      # d'erreur compréhensible et sans rien à faire depuis le
      # téléphone.
      #
      # Un test unitaire ne peut pas interdire la clé vide : elle est
      # légitime aujourd'hui. Le contrôle vit donc ici, à l'endroit
      # exact où une version part vers de vrais téléphones, et il se
      # lève seulement si on le lui demande explicitement.
      - name: La clé anti-robot est-elle posée ?
        run: |
          CLE=$(sed -n 's/^[[:space:]]*OASIS_TURNSTILE_SITE_KEY:[[:space:]]*//p' project.yml | tr -d "\"' " | tr -d '[:space:]')
          if [ -n "$CLE" ]; then
            echo "Clé de site anti-robot présente (${#CLE} caractères)."
            exit 0
          fi
          if [ "${{ inputs.sans_captcha }}" = "true" ]; then
            echo "::warning::Version publiée SANS clé anti-robot, à la demande. Le réglage CAPTCHA de Supabase doit rester ÉTEINT tant que cette version est celle du parc."
            exit 0
          fi
          echo "::error::OASIS_TURNSTILE_SITE_KEY est vide dans project.yml."
          echo "Sans clé, cette version n'enverra AUCUN jeton anti-robot."
          echo "Le jour où le réglage CAPTCHA sera activé chez Supabase, tous les téléphones porteurs de cette version seront refusés à la connexion."
          echo "Posez la clé de SITE Cloudflare Turnstile dans project.yml, ou relancez ce workflow en cochant « sans_captcha »."
          exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      - name: Import signing certificate into a temporary keychain
        run: |
          # The .p12 is built here, on the runner, with its own openssl -
          # a .p12 built on Windows with OpenSSL 3.x's modern AES-256
          # encryption round-trips fine through openssl itself but macOS's
          # `security import` silently rejects it ("wrong password?" even
          # with the correct one) since Keychain Services still expects the
          # legacy RC2/3DES PKCS12 scheme. Building it here with the
          # runner's own openssl avoids that mismatch, and the export
          # password only needs to exist transiently within this step.
          echo "${{ secrets.APPLE_DISTRIBUTION_PRIVATE_KEY }}" | base64 --decode > "$RUNNER_TEMP/key.pem"
          echo "${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PEM }}" | base64 --decode > "$RUNNER_TEMP/cert.pem"

          P12_PASSWORD=$(uuidgen)
          openssl pkcs12 -export \
            -out "$RUNNER_TEMP/distribution.p12" \
            -inkey "$RUNNER_TEMP/key.pem" \
            -in "$RUNNER_TEMP/cert.pem" \
            -passout "pass:$P12_PASSWORD" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          echo "profile.mobileprovision size: $(wc -c < "$RUNNER_TEMP/profile.mobileprovision") bytes (expected ~12000)"
          # `security cms -D` verifies Apple's signature chain, which isn't
          # trusted by default on a fresh CI keychain and fails with
          # "Cannot parse a NULL or zero-length data" rather than a clearer
          # trust error. The embedded plist is readable as plain text within
          # the signed blob regardless, so pull the UUID directly from that.
          PROFILE_UUID=$(grep -a -A1 '<key>UUID</key>' "$RUNNER_TEMP/profile.mobileprovision" | grep -o '[0-9A-Fa-f]\{8\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{12\}')
          echo "Profile UUID: $PROFILE_UUID"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project OasisCare.xcodeproj \
            -scheme OasisCare \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/OasisCare.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.oasisrarecare.app</key>
                  <string>Oasis Care AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OasisCare.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"
