name: iOS Build

on:
  push:
    # Phase 11 added web-pro/, a Next.js app that this workflow cannot
    # build and does not affect. Without this filter every web-only
    # commit would spend ~10 minutes on a macOS runner to rebuild an
    # unchanged iOS app.
    paths-ignore:
      - "web-pro/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project OasisCare.xcodeproj \
            -scheme OasisCare \
            -destination "generic/platform=iOS Simulator"

      - name: Find an available iPhone simulator
        id: destination
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -Eo '[0-9A-Fa-f-]{36}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Run UI tests (iOS Simulator)
        id: uitest
        run: |
          set -o pipefail
          xcodebuild test \
            -project OasisCare.xcodeproj \
            -scheme OasisCare \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            2>&1 | tee test-output.log

      - name: Surface failure details
        if: failure() && steps.uitest.outcome == 'failure'
        run: |
          echo "::group::Matching error/failure lines from the test log"
          grep -E "error:|Assertion Failure|XCTAssert.*failed|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*|fatal error" test-output.log | tail -25 || echo "No matching lines found, see the full log artifact"
          echo "::endgroup::"
          SUMMARY=$(grep -E "error:|Assertion Failure|XCTAssert.*failed|\*\* TEST FAILED \*\*|\*\* BUILD FAILED \*\*|fatal error" test-output.log | tail -5 | tr '\n' ' ' | cut -c1-800)
          echo "::error::${SUMMARY:-Test failed with no matched error lines - see the test-output-log artifact}"

      - name: Upload full test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log
