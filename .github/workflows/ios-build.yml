name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project OasisCare.xcodeproj \
            -scheme OasisCare \
            -destination "generic/platform=iOS Simulator"

      - name: Find an available iPhone simulator
        id: destination
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -Eo '[0-9A-Fa-f-]{36}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Run UI tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project OasisCare.xcodeproj \
            -scheme OasisCare \
            -destination "id=${{ steps.destination.outputs.udid }}"
