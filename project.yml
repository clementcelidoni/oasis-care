name: OasisCare

options:
  bundleIdPrefix: com.oasisrarecare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  OasisCare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCare
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Oasis Care
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Oasis Care a besoin de l'appareil photo pour prendre des photos de vos végétaux."
        NSLocationWhenInUseUsageDescription: "Oasis Care peut utiliser votre position pour afficher la météo d'un jardin. Vous pouvez toujours saisir une position manuellement."
        NFCReaderUsageDescription: "Oasis Care utilise le NFC pour associer une étiquette intelligente à un végétal et l'ouvrir en approchant votre iPhone."
        NSHomeKitUsageDescription: "Oasis Care utilise l'accès à Maison pour afficher et contrôler les équipements connectés liés à vos plantes, votre jardin, votre serre ou votre bassin."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.oasisrarecare.app
        # §15 — LE DOMAINE DES ÉTIQUETTES, DÉCLARÉ POUR QUE LA PROMESSE
        # SOIT VRAIE.
        #
        # SmartTagConfig annonce trois sources : un réglage enregistré,
        # cette clé, puis un défaut. Les deux premières étaient INERTES —
        # la clé n'était déclarée nulle part, et l'en-tête du fichier
        # promettait pourtant « une bascule de domaine ne demande pas
        # une nouvelle version sur l'App Store ». Seule la constante
        # s'appliquait : l'adresse était, en pratique, codée en dur.
        #
        # La valeur ci-dessous est la MÊME que le défaut du code. Ce
        # n'est pas une redondance inutile : c'est le seul endroit où un
        # binaire de recette peut la changer sans toucher au code, et
        # c'est ce qui rend le levier réel plutôt que théorique.
        #
        # ELLE DOIT RESTER ALIGNÉE AVEC OASIS_ETIQUETTES_BASE_URL côté
        # serveur. Le web imprime les planches, le téléphone écrit les
        # puces NFC : deux moitiés du même produit, une seule adresse.
        OASIS_ETIQUETTES_DOMAINE: oasisrarecare.com
        # ══════════════════════════════════════════════════════════
        # LA VÉRIFICATION ANTI-ROBOT — LA CLÉ DE SITE, ET RIEN QUE
        # LA CLÉ DE SITE.
        # ══════════════════════════════════════════════════════════
        #
        # L'ORDRE EST IMPOSÉ ET NE SE NÉGOCIE PAS. Le réglage du
        # captcha chez Supabase est GLOBAL : dès qu'il est actif, tout
        # client qui n'envoie pas de jeton est refusé, y compris
        # l'application déjà installée sur les téléphones.
        #   a. les trois portes envoient le jeton ;
        #   b. une version iPhone part sur TestFlight ET EST INSTALLÉE ;
        #   c. ALORS SEULEMENT le réglage est activé chez Supabase.
        # Inverser (b) et (c) verrouille dehors tout le parc, sans
        # message d'erreur compréhensible. La marche à suivre pour le
        # dirigeant, étape par étape et avec le retour en arrière en
        # trente secondes, est dans docs/captcha-mise-en-service.md.
        #
        # LA CLÉ CI-DESSOUS EST VIDE, ET C'EST UN ÉTAT VALIDE, PAS UN
        # OUBLI. Sans elle, `TurnstileConfig` ne monte aucune vue web
        # et les appels partent sans jeton — c'est-à-dire exactement le
        # comportement d'aujourd'hui. L'application reste donc
        # livrable, installable et utilisable tant que le réglage
        # Supabase est éteint.
        #
        # ELLE DOIT ÊTRE REMPLIE AVANT LA VERSION TESTFLIGHT DE
        # L'ÉTAPE (b), sinon l'étape (c) enferme le parc dehors. C'est
        # la clé de SITE, celle de Cloudflare Turnstile : elle est
        # PUBLIQUE, elle vit dans le client, elle est visible de tous,
        # c'est son métier. La clé SECRÈTE, elle, ne vient JAMAIS ici :
        # elle se pose à la main dans le tableau de bord Supabase.
        #
        # LE DOMAINE DE LA CLÉ DE SITE DOIT INCLURE oasisrarecare.com,
        # celui déclaré ci-dessous. Cloudflare compare l'hôte de la page
        # qui porte le widget à la liste attachée à la clé ; un domaine
        # absent produit une erreur 110200 et aucun jeton, jamais.
        #
        # UNE CLÉ D'ESSAI NE DOIT JAMAIS PARTIR D'ICI. Appariée à la clé
        # secrète de production, elle refuse tout le monde. Un test
        # relit ce fichier et échoue si l'une d'elles y figure : les
        # essais à la main se font par argument de lancement
        # (-turnstile.cledesite 1x00000000000000000000AA), pas ici.
        OASIS_TURNSTILE_SITE_KEY: ""
        # L'origine annoncée à Cloudflare pour la page du widget, qui
        # est fabriquée en mémoire plutôt qu'hébergée. Elle doit rester
        # alignée avec le domaine autorisé sur la clé de site — même
        # contrainte d'alignement que OASIS_ETIQUETTES_DOMAINE
        # ci-dessus, et même conséquence si on l'oublie : rien ne se
        # voit à l'écran, tout se voit à la porte d'entrée.
        OASIS_TURNSTILE_ORIGINE: https://oasisrarecare.com
    entitlements:
      path: Generated/OasisCare.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.nfc.readersession.formats:
          - TAG
        # HomeKit. Sans cette clé, HMHomeManager rend une liste de
        # maisons VIDE — toujours, silencieusement, même avec
        # NSHomeKitUsageDescription posé et le délégué correctement
        # branché. C'est exactement le symptôme constaté : « l'application
        # ne trouve jamais les maisons alors que j'en ai. »
        #
        # ATTENTION : cette ligne ne suffit pas à elle seule. La
        # capacité HomeKit doit AUSSI être activée sur l'App ID dans le
        # portail développeur Apple, sinon la signature échoue avec
        # « provisioning profile doesn't include the
        # com.apple.developer.homekit entitlement » — le même passage
        # obligé que Sign in with Apple en Phase 3A.
        com.apple.developer.homekit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisrarecare.app
        PRODUCT_NAME: OasisCare
        DEVELOPMENT_LANGUAGE: fr
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Oasis Care AppStore"
          DEVELOPMENT_TEAM: 43JXH6J99A

  OasisCareUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCareUITests
    dependencies:
      - target: OasisCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisrarecare.app.uitests
        DEVELOPMENT_LANGUAGE: fr
        GENERATE_INFOPLIST_FILE: "YES"

  OasisCareTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCareTests
    dependencies:
      - target: OasisCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisrarecare.app.tests
        DEVELOPMENT_LANGUAGE: fr
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OasisCare.app/OasisCare"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OasisCare:
    build:
      targets:
        OasisCare: all
        OasisCareUITests: [test]
        OasisCareTests: [test]
    test:
      targets:
        - OasisCareUITests
        - OasisCareTests
    run:
      config: Debug
      # Phase 12 §12V — lets subscriptions be tested locally without
      # App Store Connect. Test-only: the prices inside are placeholders
      # so Xcode will load the file at all, never a pricing decision
      # (see STOREKIT_TESTING.md).
      storeKitConfiguration: OasisCare.storekit
    archive:
      config: Release
