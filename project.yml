name: OasisCare

options:
  bundleIdPrefix: com.oasiscare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  OasisCare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCare
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Oasis Care
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasiscare.app
        PRODUCT_NAME: OasisCare
        DEVELOPMENT_LANGUAGE: fr

  OasisCareUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCareUITests
    dependencies:
      - target: OasisCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasiscare.app.uitests
        DEVELOPMENT_LANGUAGE: fr

schemes:
  OasisCare:
    build:
      targets:
        OasisCare: all
        OasisCareUITests: [test]
    test:
      targets:
        - OasisCareUITests
    run:
      config: Debug
