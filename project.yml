name: OasisCare

options:
  bundleIdPrefix: com.oasisrarecare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  OasisCare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCare
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Oasis Care
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisrarecare.app
        PRODUCT_NAME: OasisCare
        DEVELOPMENT_LANGUAGE: fr
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"

  OasisCareUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OasisCareUITests
    dependencies:
      - target: OasisCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisrarecare.app.uitests
        DEVELOPMENT_LANGUAGE: fr
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  OasisCare:
    build:
      targets:
        OasisCare: all
        OasisCareUITests: [test]
    test:
      targets:
        - OasisCareUITests
    run:
      config: Debug
    archive:
      config: Release
